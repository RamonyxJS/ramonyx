packages:
  - "packages/*"
  - "apps/*"

# esbuild (dipakai tsx) butuh postinstall untuk memverifikasi binary platform.
# workerd (smoke platform edge, ADR-0068) butuh postinstall untuk menyiapkan binary.
allowBuilds:
  esbuild: true
  workerd: true

# Supply chain: versi rilis baru baru boleh dipakai setelah 24 jam (menahan rilis terkompromi).
# Kebijakan lengkap: docs/security/dependency-policy.md
minimumReleaseAge: 1440

# Advisory: hyperid <4 menarik uuid <11.1.1 (moderate). autocannon 8 memakai API
# hyperid yang sama (factory + id string); dipaksa ke 4.0.0 yang menjatuhkan uuid.
# Verifikasi perilaku: `pnpm bench:report` (menjalankan autocannon) + `pnpm audit`.
overrides:
  hyperid: "4.0.0"
  # Miniflare 4.20260730.0 pins older sharp/undici with high-severity advisories.
  # The APIs used by our edge smoke are unchanged; verify with `pnpm test:edge`.
  miniflare>sharp: "0.35.5"
  miniflare>undici: "7.30.1"
