[package]
name = "js-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Engine JavaScript (V8 via deno_core): script + ESM/TypeScript + I/O runtime (R1/R2)."

[dependencies]
bytes = "1"
deno_ast = { version = "=0.53.3", features = ["transpiling"] }
deno_core = "0.412.0"
deno_error = "=0.7.1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1"
url = "2"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
runtime-core = { path = "../runtime-core" }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

[dev-dependencies]
rcgen = "0.14"
