name: Stage check (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: List staged versions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm stage list --json | tee /tmp/staged.json
          node -e "const fs=require('fs');const items=JSON.parse(fs.readFileSync('/tmp/staged.json','utf8'));console.log('staged:',items.map(i=>({name:i.name,version:i.version,stageId:i.stageId})))"
