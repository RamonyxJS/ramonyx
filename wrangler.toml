# Cloudflare Worker untuk situs Ramonyx.
# Build dulu: `pnpm build:worker` (docs static + landing edge).
#
# Deploy kanonis: `pnpm deploy:worker` (build + `wrangler deploy`) → ramonyx.devmoon.net.
# Preview: `pnpm dlx wrangler deploy` → URL *.workers.dev.
# Custom domain aktif lewat blok [[routes]] di bawah; GitHub Pages hanya mirror /ramonyx.
name = "ramonyx-site"
main = "apps/docs/dist/worker/index.js"
compatibility_date = "2026-10-21"
workers_dev = true

[assets]
directory = "apps/docs/dist/static"
binding = "ASSETS"
run_worker_first = true
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

# Waitlist (Workers KV). Buat namespace:
#   pnpm dlx wrangler kv namespace create WAITLIST
# lalu isi id dan hapus komentar.
[[kv_namespaces]]
binding = "WAITLIST"
id = "9a90649976b144359ece1c72e98af3ee"

[triggers]
crons = ["17 * * * *"]

# Custom domain Worker aktif (Cloudflare membuat record proxied otomatis):
[[routes]]
pattern = "ramonyx.devmoon.net"
custom_domain = true
