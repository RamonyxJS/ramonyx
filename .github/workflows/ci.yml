name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: lint → typecheck → test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Aktifkan pnpm (corepack)
        run: corepack enable pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Security checks
        run: pnpm audit --audit-level high
      # Build menyusul Phase 2 (ADR-0005: tanpa bundler di Phase 1)
