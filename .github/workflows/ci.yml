name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Audit mingguan (advisory baru terdeteksi walau tidak ada push).
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  rust:
    name: Rust runtime (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Aktifkan pnpm (corepack)
        run: corepack enable pnpm
      # Fixture compatibility (`tests/compatibility/fixtures`) mengimpor paket workspace
      # `@ramonyx/*` + react lewat resolusi node_modules — butuh install di job ini.
      - name: Install (node_modules untuk fixture compat)
        run: pnpm install --frozen-lockfile
      # Satu sumber versi: channel dibaca dari rust-toolchain.toml (action butuh input eksplisit).
      - name: Baca channel Rust dari rust-toolchain.toml
        id: rust
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          if [ -z "$channel" ]; then
            echo "channel tidak ditemukan di rust-toolchain.toml"; exit 1
          fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "Rust: ${channel}"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  gate:
    name: lint → typecheck → test → build → e2e → security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Aktifkan pnpm (corepack)
        run: corepack enable pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Docs machine layer (blocking)
        run: pnpm docs:validate
      - name: Build (client bundle)
        run: pnpm build
      - name: Install Chromium (Playwright)
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E (browser)
        run: pnpm test:e2e
      - name: Docs site E2E (publik, a11y, kebijakan konten — blocking)
        run: pnpm test:docs
      - name: Docs no-leak gate (blocking)
        run: pnpm docs:no-leak
      - name: Edge smoke (workerd — runtime platform nyata)
        run: pnpm test:edge
      - name: Security benchmark (abuse-case + soak)
        run: pnpm bench:security
      - name: Performance report (report-only, non-blocking)
        run: pnpm bench:report
      - name: Performance report SSR (report-only, non-blocking)
        run: pnpm bench:ssr:report
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            benchmarks/results/
            benchmarks/results/latest-http.json
            test-results/web-vitals-latest.json
          if-no-files-found: error
      - name: Security checks
        run: pnpm audit --audit-level high
