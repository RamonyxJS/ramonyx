name: Release

# Rilis v1 (ADR-0039) + penyempurnaan pra-publikasi (ADR-0049): dipicu tag `v*` (mis. v0.1.0).
# Menghasilkan artefak (tarball npm + binary runtime + SHA256SUMS + manifest), memverifikasi
# instalasi di proyek konsumen bersih, lalu (opsional, butuh rahasia NPM_TOKEN)
# **mempublikasikan tarball yang sudah diverifikasi itu juga** — tanpa build ulang, sehingga
# bit yang terbit identik dengan bit yang diuji.
#
# Dist-tag mengikuti nama tag: `-alpha` → alpha, `-beta` → beta, `-rc` → rc, selain itu latest.
# Provenance npm aktif otomatis bila repo publik (butuh `id-token: write`).
#
# Catatan jujur: alur ini belum pernah dijalankan di runner GitHub (belum ada remote);
# verifikasi lokal: `pnpm release` + `pnpm release:verify` + `npm publish --dry-run`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  artifacts:
    name: Build artefak rilis + verifikasi
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Toolchain Rust (ikut rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
      - uses: Swatinem/rust-cache@v2
      - name: Aktifkan pnpm (corepack)
        run: corepack enable pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Cek tag vs versi (Cargo.toml = sumber versi)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(node -e "const fs=require('fs');const m=/^version = \"([^\"]+)\"/m.exec(fs.readFileSync('Cargo.toml','utf8'));if(!m)process.exit(1);process.stdout.write(m[1]);")"
          if [ "$expected" != "$actual" ]; then
            echo "Tag ${GITHUB_REF_NAME} tidak cocok dengan versi ${actual} — samakan sebelum rilis."
            exit 1
          fi
          echo "versi cocok: ${actual}"
      - name: Gate cepat (lint + typecheck + test)
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: Build artefak rilis
        run: pnpm release
      - name: Verifikasi instalasi dari tarball (Node polos)
        run: pnpm release:verify
      - name: Upload artefak
        uses: actions/upload-artifact@v4
        with:
          name: ramonyx-release
          path: |
            dist/npm/*.tgz
            dist/runtime/*.tar.gz
            dist/SHA256SUMS
            dist/release-manifest.json
          if-no-files-found: error
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Ramonyx ${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md \
            dist/npm/*.tgz dist/runtime/*.tar.gz dist/SHA256SUMS dist/release-manifest.json

  publish-npm:
    name: Publikasi npm (butuh NPM_TOKEN)
    needs: artifacts
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # provenance npm (hanya berlaku untuk repo publik)
    steps:
      - name: Unduh tarball hasil verifikasi
        uses: actions/download-artifact@v4
        with:
          name: ramonyx-release
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Publikasi (skip bila NPM_TOKEN kosong)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          PUBLIC_REPO: ${{ github.event.repository.visibility == 'public' }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN tidak diatur — publikasi dilewati (artefak tetap diunggah ke Release)."
            exit 0
          fi

          case "$TAG_NAME" in
            *-alpha*) DIST_TAG=alpha ;;
            *-beta*) DIST_TAG=beta ;;
            *-rc*) DIST_TAG=rc ;;
            *) DIST_TAG=latest ;;
          esac
          echo "dist-tag: ${DIST_TAG} (dari tag ${TAG_NAME})"

          PROVENANCE=()
          if [ "$PUBLIC_REPO" = "true" ]; then
            PROVENANCE=(--provenance)
            echo "provenance: aktif (repo publik)"
          else
            echo "provenance: dilewati (repo tidak publik)"
          fi

          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"

          shopt -s nullglob
          TARBALLS=(dist/npm/*.tgz)
          if [ ${#TARBALLS[@]} -eq 0 ]; then
            echo "tidak ada tarball di dist/npm — periksa unduhan artefak job sebelumnya."
            exit 1
          fi
          echo "memproses ${#TARBALLS[@]} tarball terverifikasi:"
          printf '  %s\n' "${TARBALLS[@]}"
          for tarball in "${TARBALLS[@]}"; do
            # Idempoten: versi yang sudah ada di registry dilewati (tag ulang aman).
            meta="$(tar -xzOf "$tarball" package/package.json)"
            name="$(printf '%s' "$meta" | node -e "const m=JSON.parse(require('node:fs').readFileSync(0,'utf8'));process.stdout.write(m.name)")"
            version="$(printf '%s' "$meta" | node -e "const m=JSON.parse(require('node:fs').readFileSync(0,'utf8'));process.stdout.write(m.version)")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "  ↷ ${name}@${version} sudah ada di registry — dilewati"
              continue
            fi
            npm publish "$tarball" --access public --tag "$DIST_TAG" "${PROVENANCE[@]}"
          done
