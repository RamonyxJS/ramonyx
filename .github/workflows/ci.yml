name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Audit mingguan (advisory baru terdeteksi walau tidak ada push).
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  rust:
    name: Rust runtime (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain Rust (ikut rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  gate:
    name: lint → typecheck → test → build → e2e → security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Aktifkan pnpm (corepack)
        run: corepack enable pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build (client bundle)
        run: pnpm build
      - name: Install Chromium (Playwright)
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E (browser)
        run: pnpm test:e2e
      - name: Security benchmark (abuse-case + soak)
        run: pnpm bench:security
      - name: Performance report (report-only, non-blocking)
        run: pnpm bench:report
      - name: Performance report SSR (report-only, non-blocking)
        run: pnpm bench:ssr:report
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmarks/results/
            benchmarks/results/latest-http.json
            test-results/web-vitals-latest.json
          if-no-files-found: error
      - name: Security checks
        run: pnpm audit --audit-level high
